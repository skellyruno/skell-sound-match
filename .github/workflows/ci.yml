name: Python test suite
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: skell-sound-match-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR runs auto-cancel; protect main, release and manual runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test requirements
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
