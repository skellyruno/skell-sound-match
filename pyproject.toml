[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skell-sound-match"
version = "0.1.0"
description = "Offline reference-audio matching diagnostics and experimentation for Skelly"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "soundfile>=0.12", "pyloudnorm>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=7"]
fit = ["scikit-learn>=1.3"]
knob_fx = ["pedalboard>=0.9.0"]
research = ["torch>=2", "auraloss>=0.4", "dasp-pytorch>=0.0.1"]

[tool.setuptools.packages.find]
include = ["skell_sound_match*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
